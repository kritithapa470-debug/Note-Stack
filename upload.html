<!DOCTYPE html>
<html>
<head>
    <title>Upload Notes</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#333;
        }

        label{
            font-weight:bold;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        input[type=file]{
            border:none;
        }

        button{
            width:100%;
            padding:12px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Upload Notes</h2>

<form action="#" method="post" enctype="multipart/form-data">

<label>Name</label>
<input type="text" name="name" required>

<label>Subject Code</label>
<input type="text" name="subjectcode" required>

<label>Description</label>
<textarea name="description" rows="4" required></textarea>

<label>Date</label>
<input type="date" name="date" required>

<label>Time</label>
<input type="time" name="time" required>

<label>Upload PDF or Image</label>
<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required>

<button type="submit">Upload</button>

</form>

</div>

</body>
</html>
