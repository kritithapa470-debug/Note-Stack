<!DOCTYPE html>
<html>
<head>
    <title>Upload Notes</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
<nav>
   <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Upload Notes</a></li>
      <li><a href="view.html">View Notes</a></li>
      </ul>
</nav>
<div>
<div class="container">

<h2>Upload Notes</h2>

<form action="#" method="post" enctype="multipart/form-data">

<label>Name</label>
<input type="text" name="name" required><br><br><br>

<label>Subject Code</label>
<input type="text" name="subjectcode" required><br><br><br>

<label>Description</label>
<textarea name="description" rows="4" required></textarea><br><br>

<label>Date</label>
<input type="date" name="date" required><br><br><br>

<label>Time</label>
<input type="time" name="time" required><br><br><br>

<label>Upload PDF or Image</label>
<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required><br><br>

<button type="submit">Upload</button>

</form>

</div>

</body>
</html>
