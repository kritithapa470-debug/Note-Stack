<!DOCTYPE html>
<html>
<head>
    <title>Notes Upload System Updated</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, button { margin: 5px; padding: 8px; }
        .note { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<h2>Upload Daily Notes</h2>

<input type="text" id="name" placeholder="Your Name"><br>
<input type="text" id="course" placeholder="Course Code"><br>
<input type="date" id="date"><br>
<input type="time" id="time"><br>
<input type="file" id="file"><br>

<button onclick="uploadNote()">Upload</button>

<hr>

<h2>Search Notes</h2>

<input type="text" id="s_name" placeholder="Name">
<input type="text" id="s_course" placeholder="Course Code">
<input type="date" id="s_date">
<input type="time" id="s_time">

<button onclick="searchNotes()">Search</button>

<hr>

<div id="results"></div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function uploadNote() {
    let name = document.getElementById("name").value;
    let course = document.getElementById("course").value;
    let date = document.getElementById("date").value;
    let time = document.getElementById("time").value;
    let fileInput = document.getElementById("file");

    if (!fileInput.files[0]) {
        alert("Please select a file");
        return;
    }

    let file = fileInput.files[0];
    let reader = new FileReader();

    reader.onload = function(e) {
        let note = {
            name,
            course,
            date,
            time,
            fileData: e.target.result,
            fileName: file.name
        };

        notes.push(note);
        localStorage.setItem("notes", JSON.stringify(notes));

        alert("Uploaded successfully!");
    };

    reader.readAsDataURL(file);
}

function searchNotes() {
    let s_name = document.getElementById("s_name").value;
    let s_course = document.getElementById("s_course").value;
    let s_date = document.getElementById("s_date").value;
    let s_time = document.getElementById("s_time").value;

    let results = notes.filter(n =>
        (s_name === "" || n.name === s_name) &&
        (s_course === "" || n.course === s_course) &&
        (s_date === "" || n.date === s_date) &&
        (s_time === "" || n.time === s_time)
    );

    displayResults(results);
}

function displayResults(data) {
    let div = document.getElementById("results");
    div.innerHTML = "";

    if (data.length === 0) {
        div.innerHTML = "<p>No results found</p>";
        return;
    }

    data.forEach(n => {
        let item = document.createElement("div");
        item.className = "note";

        item.innerHTML = `
            <p><b>Name:</b> ${n.name}</p>
            <p><b>Course:</b> ${n.course}</p>
            <p><b>Date:</b> ${n.date}</p>
            <p><b>Time:</b> ${n.time}</p>
            <a href="${n.fileData}" target="_blank">View File (${n.fileName})</a>
        `;

        div.appendChild(item);
    });
}
</script>

</body>
</html>
