<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Note Share - Daily Class Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📚 Note Share</h1>
    <p>Share your class notes daily. Stay consistent. Build your streak!</p>
</header>

<!-- LOGIN -->
<section id="login-section" class="card">
    <h2>Enter your name to get started</h2>

    <input
        type="text"
        id="username-input"
        placeholder="Enter your name">

    <button id="login-btn">Continue</button>
</section>

<!-- MAIN APP -->
<main id="app-section" style="display:none;">

    <!-- Profile -->
    <div class="card">

        <h2>Welcome,
            <span id="welcome-name"></span>
            👋
        </h2>

        <p>⭐ Points:
            <span id="user-points">0</span>
        </p>

        <p>🔥 Streak:
            <span id="user-streak">0</span>
            day(s)
        </p>

    </div>

    <!-- Upload -->
    <div class="card">

        <h2>Upload Today's Note</h2>

        <form id="upload-form">

            <input
                type="text"
                id="subject-input"
                placeholder="Subject"
                required>

            <input
                type="file"
                id="file-input"
                accept=".pdf"
                required>

            <button type="submit">
                Upload Note
            </button>

        </form>

        <p id="upload-message"></p>

    </div>

    <!-- Notes -->
    <div class="card">

        <h2>📄 Shared Notes</h2>

        <input
            type="text"
            id="filter-input"
            placeholder="Filter by subject">

        <ul id="notes-list"></ul>

    </div>

    <!-- Leaderboard -->
    <div class="card">

        <h2>🏆 Leaderboard</h2>

        <ol id="leaderboard-list"></ol>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
